services:
  db:
    image: postgres:16
    container_name: coworkly-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: coworkly
    ports:
      - "5432:5432"
    volumes:
      - coworkly-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coworkly"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  coworkly-db-data: